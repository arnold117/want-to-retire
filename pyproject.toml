[project]
name = "wtr"
version = "0.1.0"
description = "Pre-registered forward test of LLM trading decisions"
requires-python = ">=3.12"
dependencies = ["websockets>=15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "python-socks[asyncio]>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"
